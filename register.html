<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - Portal Keamanan</title>
    <link rel="stylesheet" href="asset/register.css">
</head>
<body>
    <div class="form-container">
        <form class="form-box">
            <h1>FORMULIR REGISTRASI</h1>
            
            <div class="input-group">
                <label for="username">Email</label>
                <input type="text" id="username" name="username" placeholder="Masukkan Email" required>
            </div>

            <div class="input-group">
                <label for="username">Nama Akun</label>
                <input type="text" id="username" name="username" placeholder="Buat nama akun unik" required>
            </div>

            <div class="input-group">
                <label for="phone">Nomor Telepon</label>
                <input type="tel" id="phone" name="phone" placeholder="Contoh: 081234567890" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Buat password yang kuat" required>
            </div>

            <div class="input-group">
                <label for="confirm-password">Konfirmasi Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Ulangi password Anda" required>
            </div>
            
            <a href="index.html" class="form-button">DAFTAR</a>
            
            <div class="bottom-link">
                <p>Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
            </div>
        </form>
    </div>
</body>
</html>
