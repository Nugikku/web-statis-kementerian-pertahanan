<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Keamanan</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="form-container">
        <form class="form-box">
            <h1>PORTAL LOGIN</h1>
            
            <div class="input-group">
                <label for="username">Email</label>
                <input type="text" id="username" name="username" placeholder="Masukkan Email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            </div>
            
            <a href="index.html" class="form-button">MASUK</a>
            
            <div class="bottom-link">
                <p>Belum punya akun? <a href="register.html">Silahkan Daftar</a></p>
            </div>
        </form>
    </div>
</body>
</html>
